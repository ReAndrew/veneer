# Veneer messages (ru). Each section below is one part of the plugin.
# Texts are MiniMessage. Keep the {placeholders}; a key you delete falls back to en.yml.

# ======================================================================
# GENERAL
# Shared by every command. {prefix} is general.prefix from config.yml; {player}, {label} and similar are filled in by the plugin.
# ======================================================================
no-permission: "{prefix}<red>У вас нет прав для этого."
player-not-found: "{prefix}<red>Игрок <white>{player} <red>не найден."
reload-done: "{prefix}<green>Конфигурация перезагружена."
alerts-enabled: "{prefix}<green>Оповещения включены."
alerts-disabled: "{prefix}<red>Оповещения выключены."
bedrock-skip: "{prefix}<yellow>{player} <gray>— игрок Bedrock, проверка пропущена."
client-too-old: "{prefix}<yellow>{player} <gray>играет на {version}: проверке табличками нужна {min} или новее, пропущено."
module-not-running: "{prefix}<red>Модуль {module} не запущен (проверьте '{module}.enabled' в config.yml).</red>"
update-available: "{prefix}<green>Доступен Veneer {latest}</green> <gray>(запущен {current})</gray> <aqua><click:open_url:'{url}'>{url}</click></aqua>"

# ======================================================================
# MOD SCAN  (/hackcheck, join and anticheat checks)
# Placeholders: {player}. Scan results go to staff with veneer.alerts and to the player who started the scan.
# ======================================================================
check-started: "{prefix}<white>Запуск проверки игрока <yellow>{player}<white>..."
check-complete: "{prefix}<white>Проверка игрока <yellow>{player}<white> завершена:"
check-timeout: "{prefix}<yellow>{player} <white>не ответил — помечен как <red>ТАЙМАУТ<white>."
doublecheck: "{prefix}<yellow>DoubleCheck<gray>: <white>{player} <gray>помечен — запуск повторной проверки..."
anticheat-trigger: "{prefix}<gray>Античит обнаружил <yellow>{player}<gray>. Запуск автоматической проверки..."
join-check: "{prefix}<gray>Автоматическая проверка <yellow>{player} <gray>при входе..."
already-checking: "{prefix}<yellow>{player} <white>уже проходит проверку."
invalid-hack: "{prefix}<red>Неизвестный чит: <white>{hack}"
hackcheck-usage: "{prefix}<red>Использование: /hackcheck \\<player> [hack1,hack2,...]</red>"
hackcheck-no-valid: "{prefix}<red>Нет допустимых читов для проверки.</red>"

# ======================================================================
# MOD SCAN  (result block)
# check-result-line: {hack}, {result}. The result texts are shown as they are; the words match the values kept in the history database.
# check-nothing-found is shown when every mod was clean and hide-clean is on; check-channels shows {channels} when show-channels is on.
# ======================================================================
check-translation-header: "{prefix}<gray>  Translation Detect:"
check-result-line: "{prefix}  <white>{hack}<gray>: {result}"
result-detected: "<red>DETECTED"
result-not-detected: "<green>NOT_DETECTED"
result-protected: "<yellow>PROTECTED"
result-timeout: "<yellow>TIMEOUT"
result-skipped: "<gray>SKIPPED"
check-nothing-found: "{prefix}<green>    Ничего не найдено"
check-channels: "{prefix}<white>  Каналы<gray>: <aqua>{channels}"

# ======================================================================
# LANGUAGE CHECK  (/hacklang)
# Placeholders: {player}, {lang}, {response}.
# ======================================================================
hacklang-usage: "{prefix}<red>Использование: /hacklang \\<player> [lang1,lang2,...]</red>"
hacklang-unknown: "{prefix}<red>Неизвестный язык: <white>{lang}</white></red>"
lang-check-started: "{prefix}<white>Проверка языка игрока <yellow>{player}<white>..."
lang-check-complete: "{prefix}<white>Язык игрока <yellow>{player}<white>: <yellow>{lang} <gray>({response})"
lang-check-unknown: "{prefix}<white>Язык игрока <yellow>{player}<white>: <red>Неизвестно <gray>({response})"
lang-check-protected: "{prefix}<white>Язык игрока <yellow>{player}<white>: <yellow>ЗАЩИЩЕН"
version-mismatch: "{prefix}<red>{player}</red> <white>заходит как <yellow>{claimed}</yellow>, но клиент на самом деле <yellow>{real}</yellow> <gray>(ViaFabricPlus, ViaProxy или похожее)"
lang-check-timeout: "{prefix}<yellow>{player} <white>не ответил — проверка языка не удалась."
lang-join-check: "{prefix}<gray>Автоматическая проверка языка игрока <yellow>{player}<gray>..."

# ======================================================================
# WEB EDITOR  (/hackeditor)
# Placeholders: {url}.
# ======================================================================
editor-url: "{prefix}<white>Редактор: <aqua><click:open_url:'{url}'>{url}</click>"
editor-disabled: "{prefix}<red>Веб-редактор отключён в config.yml."
editor-players-only: "{prefix}<red>Открывать редактор могут только игроки.</red>"


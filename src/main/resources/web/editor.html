<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Veneer | Panel</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        :root{
          --bg:#0d1117;--surface:#161b22;--surface2:#21262d;--border:#30363d;
          --blue:#4493f8;--blue-dim:#1f3a5c;--text:#e6edf3;--text2:#8b949e;
          --green:#3fb950;--red:#f85149;--yellow:#d29922;--gray:#484f58;
          --radius:8px;--font:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif
        }
        body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;height:100vh;display:flex;flex-direction:column;overflow:hidden}
        header{background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;height:56px;display:flex;align-items:center;gap:16px;flex-shrink:0}
        .logo{font-weight:700;font-size:16px;color:var(--text)}
        .logo span{color:var(--blue)}
        .header-spacer{flex:1}
        .home-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:6px 12px;border-radius:var(--radius);cursor:pointer;font-size:13px;font-family:var(--font);transition:all .15s}
        .home-btn:hover{border-color:var(--blue);color:var(--text)}
        .player-badge{display:flex;align-items:center;gap:8px;color:var(--text2);font-size:13px;margin-left:8px}
        .player-badge img{border-radius:4px;image-rendering:pixelated;width:24px;height:24px}
        .layout{display:grid;grid-template-columns:240px 1fr 260px;flex:1;overflow:hidden}
        .layout.wide{grid-template-columns:1fr}
        .layout.wide > .panel{display:none}
        .panel{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
        .panel-right{border-right:none;border-left:1px solid var(--border)}
        .panel-title{padding:12px 16px 10px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.6px;border-bottom:1px solid var(--border);flex-shrink:0}
        .search-wrap{padding:10px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
        .search-wrap input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:7px 10px;font-size:13px;font-family:var(--font);outline:none;transition:border-color .15s}
        .search-wrap input:focus{border-color:var(--blue)}
        .search-wrap input::placeholder{color:var(--text2)}
        .search-wrap button{width:100%;margin-top:6px;background:var(--blue-dim);border:1px solid var(--blue);color:var(--blue);border-radius:var(--radius);padding:7px;cursor:pointer;font-size:13px;font-family:var(--font);transition:all .15s}
        .search-wrap button:hover{background:var(--blue);color:#fff}
        .panel-scroll{flex:1;overflow-y:auto;padding:6px}
        .panel-scroll::-webkit-scrollbar{width:4px}
        .panel-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
        .player-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:var(--radius);cursor:pointer;transition:background .12s;border:1px solid transparent}
        .player-item:hover{background:var(--surface2);border-color:var(--border)}
        .player-item img{border-radius:3px;image-rendering:pixelated;flex-shrink:0;width:28px;height:28px;background:var(--surface2)}
        .player-item-name{font-size:13px;color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
        .online-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0}
        .scan-item{padding:9px 10px;border-radius:var(--radius);cursor:pointer;border:1px solid var(--border);margin-bottom:5px;background:var(--bg);transition:border-color .12s}
        .scan-item:hover{border-color:var(--blue)}
        .scan-item-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
        .scan-item-name{font-weight:600;font-size:12px;color:var(--text)}
        .scan-item-time{font-size:11px;color:var(--text2)}
        .scan-item-meta{font-size:11px;color:var(--text2)}
        main{overflow-y:auto;padding:20px;background:var(--bg)}
        main::-webkit-scrollbar{width:5px}
        main::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
        .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
        .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
        .stat-card-num{font-size:26px;font-weight:700;color:var(--text);line-height:1}
        .stat-card-label{font-size:11px;color:var(--text2);margin-top:3px}
        .section-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px}
        .player-header{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:16px}
        .player-header img{border-radius:6px;image-rendering:pixelated;width:64px;height:64px;background:var(--surface2)}
        .player-header-info h2{font-size:20px;font-weight:700;color:var(--text)}
        .player-header-info p{font-size:11px;color:var(--text2);margin-top:2px;font-family:monospace}
        .online-badge{display:inline-flex;align-items:center;gap:4px;background:#1a2e1a;border:1px solid #2d5a2d;color:var(--green);border-radius:20px;padding:2px 9px;font-size:11px;margin-top:5px}
        .offline-badge{display:inline-flex;align-items:center;gap:4px;background:var(--surface2);border:1px solid var(--border);color:var(--text2);border-radius:20px;padding:2px 9px;font-size:11px;margin-top:5px}
        .scan-cards{display:flex;flex-direction:column;gap:8px}
        .scan-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:border-color .15s}
        .scan-card:hover{border-color:var(--blue)}
        .scan-card-header{padding:10px 14px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .scan-card-meta{font-size:11px;color:var(--text2);padding:6px 14px;border-bottom:1px solid var(--border)}
        .scan-card-type{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--blue)}
        .scan-card-time{font-size:11px;color:var(--text2)}
        .results-table{width:100%;border-collapse:collapse}
        .results-table th{text-align:left;padding:8px 14px;font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--border)}
        .results-table td{padding:8px 14px;border-bottom:1px solid var(--border);font-size:13px}
        .results-table tr:last-child td{border-bottom:none}
        .badge{display:inline-flex;border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600}
        .badge-DETECTED{background:#3d1a1a;border:1px solid #7c2020;color:var(--red)}
        .badge-NOT_DETECTED{background:#1a2e1a;border:1px solid #2d5a2d;color:var(--green)}
        .badge-PROTECTED{background:#2e2410;border:1px solid #5a3d10;color:var(--yellow)}
        .badge-SKIPPED{background:var(--surface2);border:1px solid var(--border);color:var(--gray)}
        .badge-lang{background:var(--blue-dim);border:1px solid var(--blue);color:var(--blue)}
        .empty-state{text-align:center;padding:40px 20px;color:var(--text2)}
        .loading{text-align:center;padding:28px;color:var(--text2);font-size:13px}
        .back-btn{background:none;border:1px solid var(--border);color:var(--text2);border-radius:var(--radius);padding:6px 12px;cursor:pointer;font-size:13px;font-family:var(--font);margin-bottom:14px;display:inline-flex;align-items:center;gap:5px;transition:all .15s}
        .back-btn:hover{border-color:var(--blue);color:var(--text)}
        .run-btn{background:var(--blue-dim);border:1px solid var(--blue);color:var(--blue);border-radius:var(--radius);padding:7px 14px;cursor:pointer;font-size:13px;font-family:var(--font);transition:all .15s;margin-bottom:14px;margin-right:8px}
        .run-btn:hover{background:var(--blue);color:#fff}
        .run-btn:disabled{opacity:.4;cursor:not-allowed}
        .toast{position:fixed;bottom:20px;right:20px;background:var(--surface);border:1px solid var(--green);color:var(--green);padding:10px 16px;border-radius:var(--radius);font-size:13px;z-index:999;opacity:0;transition:opacity .2s;pointer-events:none}
        .toast.show{opacity:1}
        .error-msg{color:var(--red);font-size:12px;padding:8px 0}
        .graph-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
        .graph-bar input{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);padding:6px 10px;font-size:13px;font-family:var(--font);outline:none}
        .graph-bar label{color:var(--text2);font-size:12px;display:flex;gap:4px;align-items:center}
        .graph-box{height:calc(100vh - 150px);min-height:360px;border:1px solid var(--border);border-radius:var(--radius);background:#05080d;position:relative;overflow:hidden}
        .graph-info{position:absolute;left:12px;bottom:10px;font-size:12px;color:var(--text2);display:flex;gap:16px;align-items:center}
        .graph-info .legend{font-size:11px}
        .legend .sq{display:inline-block;width:10px;height:10px;border:3px solid;border-radius:2px;margin:0 4px 0 12px;vertical-align:-1px}
        .legend i{display:inline-block;width:16px;border-top:3px solid;margin:0 4px 0 12px;vertical-align:3px}
        .dbg-log{position:absolute;left:10px;top:10px;width:520px;max-height:260px;overflow:auto;margin:0;padding:8px 10px;background:#0d1117e6;border:1px solid var(--border);border-radius:var(--radius);color:#7ee787;font:11px/1.45 monospace;z-index:6;white-space:pre-wrap;pointer-events:none}
        .graph-info{z-index:3}
        .node-card{position:absolute;top:12px;right:12px;width:270px;max-height:calc(100% - 24px);overflow-y:auto;background:#161b22f2;border:1px solid var(--border);border-radius:var(--radius);padding:14px;z-index:5;font-size:12px}
        .node-card h3{font-size:16px;margin-bottom:2px;display:flex;justify-content:space-between;align-items:center}
        .node-card h3 button{background:none;border:none;color:var(--text2);cursor:pointer;font-size:16px}
        .node-card h4{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--text2);margin:12px 0 5px}
        .node-card .row{display:flex;justify-content:space-between;gap:8px;padding:3px 0;border-bottom:1px solid var(--border);color:var(--text)}
        .node-card .row span:last-child{color:var(--text2);white-space:nowrap}
        .node-card .alt{cursor:pointer}.node-card .alt:hover{color:var(--blue)}
        .node-card .bits{font-family:monospace;letter-spacing:1px;color:var(--text)}
      .no-links .links-btn, .no-scan .run-btn { display: none; }
</style>
</head>
<body>
<header>
    <span class="logo">Vene<span>er</span> Panel</span>
    <div class="header-spacer"></div>
    <div class="player-badge" id="player-badge"></div>
    <button class="home-btn" onclick="showMods()">☢ Mods detected</button>
    <button class="home-btn links-btn" onclick="showLinks()">⚯ Links</button>
    <button class="home-btn" onclick="showHome()">⌂ Home</button>
</header>
<div class="layout">
    <aside class="panel">
        <div class="panel-title">Players</div>
        <div class="search-wrap">
            <input type="text" id="search-input" placeholder="Search player..." onkeydown="if(event.key==='Enter')searchPlayer()">
            <button onclick="searchPlayer()">Search</button>
        </div>
        <div class="panel-scroll" id="offline-history"></div>
    </aside>
    <main id="main-content">
        <div class="loading">Loading...</div>
    </main>
    <aside class="panel panel-right">
        <div class="panel-title">Recent Scans</div>
        <div class="panel-scroll" id="recent-scans"></div>
        <div class="panel-title" style="border-top:1px solid var(--border)">Online Players</div>
        <div style="height:220px;overflow-y:auto;padding:6px;flex-shrink:0" id="online-players"></div>
    </aside>
</div>
<div class="toast" id="toast"></div>
<script src="/web/three.min.js"></script>
<script src="/web/3d-force-graph.min.js"></script>
<script>
    const token = new URLSearchParams(location.search).get('token');

    function apiUrl(path) {
      const sep = path.includes('?') ? '&' : '?';
      return '/api/' + path + sep + 'token=' + encodeURIComponent(token);
    }

    async function apiFetch(path, opts) {
      const r = await fetch(apiUrl(path), opts || {});
      const text = await r.text();
      let json;
      try { json = JSON.parse(text); } catch(e) { throw new Error('Invalid JSON: ' + text.slice(0,100)); }
      if (!r.ok) throw new Error(json.error || r.status);
      return json;
    }

    async function apiPost(path, body) {
      return apiFetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    let offlineHistory = [];
    try { offlineHistory = JSON.parse(localStorage.getItem('ch_history') || '[]'); } catch(e) {}

    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2500);
    }

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function timeAgo(ts) {
      const d = Date.now() - Number(ts);
      if (d < 60000) return 'just now';
      if (d < 3600000) return Math.floor(d/60000) + 'm ago';
      if (d < 86400000) return Math.floor(d/3600000) + 'h ago';
      return new Date(Number(ts)).toLocaleDateString();
    }

    function headUrl(id) {
      return 'https://mc-heads.net/avatar/' + encodeURIComponent(id) + '/32';
    }

    function badge(result) {
      const r = String(result || 'SKIPPED').toUpperCase();
      return '<span class="badge badge-' + r + '">' + r + '</span>';
    }

    async function init() {
      try {
        const info = await apiFetch('validate');
        // The server refuses what the token has no right to; hide those controls so they are not offered
        const perms = String(info.perms || '').split(',');
        document.body.classList.toggle('no-links', !perms.includes('links'));
        document.body.classList.toggle('no-scan', !perms.includes('scan'));
        document.getElementById('player-badge').innerHTML =
          '<img src="' + headUrl(info.player_uuid) + '" onerror="this.style.visibility=\'hidden\'" alt=""> ' + esc(info.player_name);
      } catch(e) {
        document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#8b949e;font-size:14px">Session expired. Run /hackeditor in Minecraft.</div>';
        return;
      }
      showHome();
      loadOnlinePlayers();
      loadRecentScans();
      renderOfflineHistory();
      setInterval(loadOnlinePlayers, 10000);
      setInterval(loadRecentScans, 15000);
    }


    let graph3d = null, graphRaf = 0;

    // Stops the graph completely: our label loop, the library's render loop, GPU buffers and the WebGL context.
    // Without this every rebuild (filter toggle) and every tab switch leaves a live renderer behind, and the
    // browser starts dropping contexts after about 16 of them.
    function stopGraph() {
      if (graphRaf) cancelAnimationFrame(graphRaf);
      graphRaf = 0;
      if (!graph3d) return;
      const g = graph3d;
      graph3d = null;
      try {
        g.scene().traverse(o => {
          if (o.geometry) o.geometry.dispose();
          [].concat(o.material || []).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
        });
        g._destructor();
        const r = g.renderer();
        r.dispose();
        r.forceContextLoss();
        const c = g.controls();
        if (c && c.dispose) c.dispose();
      } catch (e) { console.warn('[links] stopGraph', e); }
    }

    // Cube with the player's skin on it: six faces cut from the 64x64 skin, hat layer drawn over the head layer
    const FACES = [ // BoxGeometry order +x -x +y -y +z -z (player's left, right, top, bottom, front, back)
      [16, 8], [0, 8], [8, 0], [16, 0], [8, 8], [24, 8]
    ];
    // Text as a 3D sprite: always faces the camera, shrinks with distance, and heads in front hide it
    function textSprite(text, height, colour) {
      const c = document.createElement('canvas'), g = c.getContext('2d');
      const font = '600 48px system-ui, -apple-system, Segoe UI, sans-serif';
      g.font = font;
      c.width = Math.ceil(g.measureText(text).width) + 20; c.height = 64;
      g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.lineWidth = 8; g.strokeStyle = 'rgba(0,0,0,.85)'; g.lineJoin = 'round';
      g.strokeText(text, c.width / 2, 33);
      g.fillStyle = '#ffffff'; g.fillText(text, c.width / 2, 33);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace; t.minFilter = THREE.LinearFilter; t.generateMipmaps = false;
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({map: t, color: colour, transparent: true, depthWrite: false}));
      sprite.scale.set(height * c.width / c.height, height, 1);
      sprite.raycast = () => {};
      return sprite;
    }

    function skinCube(n, size) {
      const edge = size, colour = n.detected ? 0xf85149 : 0x4493f8;
      const group = new THREE.Group();
      const canvases = FACES.map(() => { const c = document.createElement('canvas'); c.width = c.height = 8; return c; });
      const mats = canvases.map(c => {
        const t = new THREE.CanvasTexture(c);
        t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false;
        t.colorSpace = THREE.SRGBColorSpace;
        return new THREE.MeshBasicMaterial({map: t, color: n.skin ? 0xffffff : colour});
      });
      if (n.skin) {
        const img = new Image();
        img.onload = () => {
          // Like the game: a hat area with no transparent pixel belongs to a legacy skin and is not drawn
          const probe = document.createElement('canvas'); probe.width = 32; probe.height = 16;
          const pg = probe.getContext('2d'); pg.drawImage(img, 32, 0, 32, 16, 0, 0, 32, 16);
          const px = pg.getImageData(0, 0, 32, 16).data;
          let hat = false; for (let i = 3; i < px.length; i += 4) if (px[i] < 128) { hat = true; break; }
          canvases.forEach((c, i) => {
            const g = c.getContext('2d'); g.imageSmoothingEnabled = false;
            g.drawImage(img, FACES[i][0], FACES[i][1], 8, 8, 0, 0, 8, 8);
            if (hat) g.drawImage(img, FACES[i][0] + 32, FACES[i][1], 8, 8, 0, 0, 8, 8);
            mats[i].map.needsUpdate = true;
          });
        };
        img.src = 'data:image/png;base64,' + n.skin;
      }
      const cube = new THREE.Mesh(new THREE.BoxGeometry(edge, edge, edge), mats);
      group.add(cube);
      // The library turns whichever mesh the pointer hit when dragging with the right button. An invisible
      // twin takes the hits instead, so the visible head and its outline are never turned by the mouse.
      cube.raycast = () => {};
      const hit = new THREE.Mesh(new THREE.BoxGeometry(edge, edge, edge), new THREE.MeshBasicMaterial({visible: false}));
      group.add(hit);
      n._hit = hit;
      const frame = new THREE.Mesh(new THREE.BoxGeometry(edge * 1.12, edge * 1.12, edge * 1.12),
        new THREE.MeshBasicMaterial({color: colour, side: THREE.BackSide}));
      frame.raycast = () => {};
      group.add(frame);
      // The name hangs under the head on screen: the sprite sits at the head's centre and its anchor is moved
      // up by the head's half-diagonal, which works from any camera angle
      const label = textSprite(n.name, Math.max(7, edge * .75), 0xc9d1d9);
      label.center.set(.5, 1 + edge * 1.05 / label.scale.y);
      group.add(label);
      n._label = label;
      n._frame = frame;
      n._edge = size;
      n._cube = cube;
      return group;
    }

    async function showMods() {
      document.querySelector('.layout').classList.remove('wide');
      const main = document.getElementById('main-content');
      main.innerHTML = '<div class="loading">Loading...</div>';
      let mods;
      try { mods = await apiFetch('mods'); } catch(e) { main.innerHTML = '<div class="error-msg">' + esc(e.message) + '</div>'; return; }
      if (!mods.length) {
        main.innerHTML = '<div class="section-title">Mods detected</div><div class="empty-state">No mods have been detected yet.</div>';
        return;
      }
      main.innerHTML = '<div class="section-title">Mods detected (' + mods.length + ')</div><div class="scan-cards">' +
        mods.map(m =>
          '<div class="scan-card" style="cursor:default"><div class="scan-card-header">' +
          '<span class="scan-card-type" style="font-size:13px">' + esc(m.name) + '</span>' +
          '<span class="scan-card-time">' + m.count + ' player' + (m.count === 1 ? '' : 's') + '</span></div>' +
          '<div style="padding:10px 14px;display:flex;flex-wrap:wrap;gap:6px">' +
          m.players.map(p => '<span class="player-item" style="padding:4px 8px" onclick="showPlayer(\'' + esc(p.name).replace(/'/g, '') + '\')" title="' + esc(timeAgo(p.last_seen)) + '">' +
            '<img src="' + headUrl(p.uuid) + '" onerror="this.style.visibility=\'hidden\'" alt="" style="width:20px;height:20px"><span class="player-item-name">' + esc(p.name) + '</span></span>').join('') +
          '</div></div>').join('') + '</div>';
    }

    async function showLinks() {
      document.querySelector('.layout').classList.add('wide');
      const main = document.getElementById('main-content');
      main.innerHTML = '<div class="loading">Loading...</div>';
      let data;
      try { data = await apiFetch('links'); } catch(e) { main.innerHTML = '<div class="error-msg">' + esc(e.message) + '</div>'; return; }
      if (!data.nodes.length) {
        main.innerHTML = '<div class="section-title">Linked accounts</div><div class="empty-state">No linked accounts yet. Links appear when accounts join from the same address or share an RPTrack fingerprint.</div>';
        return;
      }
      main.innerHTML =
        '<div class="section-title">Linked accounts</div>' +
        '<div class="graph-bar"><input id="g-search" placeholder="Find account...">' +
        '<label><input type="checkbox" id="g-ip" checked> same address</label>' +
        '<label><input type="checkbox" id="g-rp" checked> same fingerprint</label>' +
        '<label><input type="checkbox" id="g-2d"> flat</label>' +
        // The debug log is for diagnosing camera problems: shown only when the page is opened with &debug
        (new URLSearchParams(location.search).has('debug') ? '<label><input type="checkbox" id="g-dbg"> debug</label>' : '<input type="checkbox" id="g-dbg" hidden>') +
        '</div>' +
        '<div class="graph-box" id="graph-box"></div>';
      const box = document.getElementById('graph-box');
      const info = document.createElement('div'); info.className = 'graph-info';
      let hl = '', searchScale = 1, hover = null, selected = null, fitted = false, ownMoveUntil = 0, lastCam = null, lastLog = 0;
      const dbgBox = document.createElement('pre'); dbgBox.className = 'dbg-log'; dbgBox.style.display = 'none';
      const dbgOn = () => document.getElementById('g-dbg').checked;
      const dbg = msg => {
        if (!dbgOn()) return;
        const t = new Date().toISOString().slice(11, 23);
        console.log('[links] ' + msg);
        dbgBox.textContent = (dbgBox.textContent + t + ' ' + msg + '\n').split('\n').slice(-16).join('\n');
        dbgBox.scrollTop = dbgBox.scrollHeight;
      };
      const v3 = p => '(' + Math.round(p.x) + ', ' + Math.round(p.y) + ', ' + Math.round(p.z) + ')';
      const moveCamera = (pos, look, ms, why) => {
        const from = graph3d.camera().position;
        dbg('camera ' + why + ': ' + v3(from) + ' -> ' + v3(pos) + ' looking at ' + v3(look) + ', ' + ms + ' ms');
        ownMoveUntil = Date.now() + ms + 100;
        graph3d.cameraPosition(pos, look, ms);
      };
      const card = document.createElement('div'); card.className = 'node-card'; card.style.display = 'none';
      const build = () => {
        const useIp = document.getElementById('g-ip').checked, useRp = document.getElementById('g-rp').checked;
        // Reasons for one pair are merged: pct = 1 - product of (1 - p), so each extra shared sign raises it
        const pairs = new Map();
        data.edges.filter(e => (e.type === 'ip' ? useIp : useRp)).forEach(e => {
          const key = e.source < e.target ? e.source + '|' + e.target : e.target + '|' + e.source;
          const l = pairs.get(key) || {source: e.source, target: e.target, miss: 1, rp: false, why: []};
          l.miss *= 1 - e.p; l.rp = l.rp || e.type === 'rptrack';
          l.why.push((e.type === 'ip' ? 'address ' : 'fingerprint ') + e.label);
          pairs.set(key, l);
        });
        const links = [...pairs.values()].map(l => ({...l, pct: 1 - l.miss}));
        const deg = {}; links.forEach(l => { deg[l.source] = (deg[l.source]||0) + 1; deg[l.target] = (deg[l.target]||0) + 1; });
        const nodes = data.nodes.filter(n => deg[n.id]).map(n => ({...n, links: deg[n.id]}));
        stopGraph();
        box.innerHTML = '';
        // A rebuild makes new node objects: drop the old selection, hover and fit state that point at the old ones
        selected = null; hover = null; fitted = false;
        card.style.display = 'none';
        graph3d = ForceGraph3D({controlType: 'orbit'})(box)
          .width(box.clientWidth).height(box.clientHeight)
          .backgroundColor('#05080d')
          .showNavInfo(false)
          .numDimensions(document.getElementById('g-2d').checked ? 2 : 3)
          .nodeThreeObject(n => skinCube(n, 9 + Math.min(n.links, 8) * 1.5))
          .nodeLabel(n => esc(n.name) + ' (' + n.links + ' links)')
          .linkColor(l => l.rp ? '#3fb950' : '#8b949e')
          .linkWidth(l => .4 + l.pct * 2.2)
          .linkLabel(l => Math.round(l.pct * 100) + '% — ' + l.why.map(esc).join(', '))
          .linkThreeObjectExtend(true)
          .linkThreeObject(l => { const t = textSprite(Math.round(l.pct * 100) + '%', 6, 0x8b949e); t.visible = false; l._label = t; return t; })
          .linkPositionUpdate((t, {start, end}) => { t.position.set((start.x + end.x) / 2, (start.y + end.y) / 2, ((start.z || 0) + (end.z || 0)) / 2); })
          .onNodeClick((n, ev) => { dbg('click on node ' + n.name + (ev ? ' (button ' + ev.button + ')' : '')); select(n); })
          .onBackgroundClick(() => { dbg('click on background'); select(null); })
          .onNodeHover(n => { hover = n ? n.id : null; })
          .warmupTicks(200)
          // No tick limit: a fixed count cut the motion off mid-flight after a drag; the time limit is a safety net
          .cooldownTicks(Infinity)
          .cooldownTime(8000)
          .d3VelocityDecay(.55)
          .onEngineStop(() => {
            if (fitted || selected) { dbg('layout settled: camera left alone (' + (selected ? 'a node is selected' : 'already fitted once') + ')'); return; }
            fitted = true; dbg('layout settled: first fit'); fit(600, 'fit after layout');
          })
          .graphData({nodes, links});
        const select = async n => {
          if (n && n === selected) n = null;
          selected = n;
          if (!n) { card.style.display = 'none'; fit(700, 'back to overview'); return; }
          const d = n.x === undefined ? null : n;
          if (d) moveCamera({x: n.x + 50, y: n.y + 30, z: (n.z || 0) + 75}, {x: n.x, y: n.y, z: n.z || 0}, 700, 'zoom to ' + n.name);
          card.style.display = '';
          card.innerHTML = '<div class="loading">Loading...</div>';
          let det;
          try { det = await apiFetch('links/' + encodeURIComponent(n.id)); } catch(e) { card.innerHTML = '<div class="error-msg">' + esc(e.message) + '</div>'; return; }
          if (selected !== n) return;
          const alts = links.filter(l => l.source.id === n.id || l.target.id === n.id)
            .map(l => ({o: l.source.id === n.id ? l.target : l.source, pct: l.pct, why: l.why}))
            .sort((a, b) => b.pct - a.pct || b.why.length - a.why.length || a.o.name.localeCompare(b.o.name));
          const fp = det.fingerprint;
          // LiquidBounce comes from the fingerprint, not a sign scan: it joins the other cheats in one list
          const cheats = det.mods.slice();
          if (fp && fp.liquidbounce && !cheats.some(m => m.name.toLowerCase() === 'liquidbounce'))
            cheats.push({name: 'LiquidBounce', last_seen: fp.last_seen, via: 'resource-pack fingerprint'});
          card.innerHTML =
            '<h3>' + esc(n.name) + '<button title="Close">✕</button></h3>' +
            '<div style="color:var(--text2)">' + (cheats.length ? '<span style="color:var(--red)">☢ mods detected</span>' : 'no mods detected') + '</div>' +
            (cheats.length ? '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:6px">' + cheats.map(m => '<span class="badge badge-DETECTED" title="Last detected: ' + esc(new Date(Number(m.last_seen)).toLocaleString()) + (m.via ? ' (' + m.via + ')' : '') + '">' + esc(m.name) + '</span>').join('') + '</div>' : '') +
            '<h4>Addresses</h4>' +
            (det.ips.length ? det.ips.map(r => '<div class="row"><span>' + esc(r.ip) + '</span><span>' + r.count + '× · ' + timeAgo(r.last_seen) + '</span></div>').join('') : '<div style="color:var(--text2)">none recorded</div>') +
            '<h4>Fingerprint</h4>' +
            (fp ? '<div class="row"><span class="bits">' + esc(fp.bits) + '</span><span>' + fp.packs + ' packs</span></div>' + '' : '<div style="color:var(--text2)">not tracked</div>') +
            '<h4>Possible alts</h4>' +
            (alts.length ? alts.map((a, i) => '<div class="row alt" data-i="' + i + '" title="' + esc(a.why.join(', ')) + '"><span>' + esc(a.o.name) + '<small style="display:block;color:var(--text2);font-size:10px">' + esc(a.why.join(', ')) + '</small></span><span>' + Math.round(a.pct * 100) + '%</span></div>').join('') : '<div style="color:var(--text2)">none</div>') +
            '<div style="margin-top:12px"><button class="run-btn" style="margin:0;background:#2f6fd6;border-color:#4493f8;color:#fff" id="card-open">Open player</button></div>';
          card.querySelector('h3 button').onclick = () => select(null);
          card.querySelector('#card-open').onclick = () => showPlayer(n.name);
          card.querySelectorAll('.alt').forEach(el => el.onclick = () => select(alts[+el.dataset.i].o));
        };
        const fit = (ms, why) => {
          const ns = nodes.filter(n => n.x !== undefined);
          if (!ns.length) return;
          const cx = ns.reduce((a, n) => a + n.x, 0) / ns.length, cy = ns.reduce((a, n) => a + n.y, 0) / ns.length, cz = ns.reduce((a, n) => a + (n.z || 0), 0) / ns.length;
          const r = Math.max(40, ...ns.map(n => Math.hypot(n.x - cx, n.y - cy, (n.z || 0) - cz)));
          const half = Math.tan(graph3d.camera().fov * Math.PI / 360);
          const dist = r * 1.25 / Math.min(half, half * box.clientWidth / box.clientHeight);
          moveCamera({x: cx, y: cy, z: cz + dist}, {x: cx, y: cy, z: cz}, ms, why || 'fit');
        };
        graph3d.d3Force('link').distance(l => 170 - 90 * l.pct).strength(l => .1 + .9 * l.pct);
        // Repulsion only reaches nearby heads: with a global -1100, dragging one head flung the whole graph around
        graph3d.d3Force('charge').strength(-320).distanceMax(450);
        // Keep heads from sitting inside each other (d3's collide force is not exposed by the bundle)
        let simNodes = [];
        const collide = () => {
          for (let i = 0; i < simNodes.length; i++) for (let j = i + 1; j < simNodes.length; j++) {
            const a = simNodes[i], b = simNodes[j];
            const dx = b.x - a.x, dy = b.y - a.y, dz = (b.z || 0) - (a.z || 0);
            const d = Math.hypot(dx, dy, dz) || .01, min = ((a._edge || 10) + (b._edge || 10)) * .85 + 44;
            if (d >= min) continue;
            const f = (min - d) / d * .2;
            a.vx -= dx * f; a.vy -= dy * f; b.vx += dx * f; b.vy += dy * f;
            if (a.vz !== undefined) { a.vz -= dz * f; b.vz += dz * f; }
          }
        };
        collide.initialize = ns => { simNodes = ns; };
        graph3d.d3Force('collide', collide);
        // Weak pull to the centre so separate groups of accounts do not drift apart
        let pullNodes = [];
        const pull = alpha => { pullNodes.forEach(n => { n.vx -= n.x * .05 * alpha; n.vy -= n.y * .05 * alpha; if (n.vz !== undefined) n.vz -= (n.z || 0) * .05 * alpha; }); };
        pull.initialize = ns => { pullNodes = ns; };
        graph3d.d3Force('pull', pull);
        info.innerHTML = '<span>' + nodes.length + ' accounts, ' + links.length + ' links</span>' +
          '<span class="legend" title="Thicker line = higher match. Hover a head or a line for details.">' +
          '<span class="sq" style="border-color:#4493f8"></span>account<span class="sq" style="border-color:#f85149"></span>mods detected' +
          '<i style="border-color:#8b949e"></i>same address<i style="border-color:#3fb950"></i>same fingerprint</span>';
        box.appendChild(info); box.appendChild(card); box.appendChild(dbgBox);
        const place = () => {
          if (!box.isConnected || !graph3d) { stopGraph(); return; } // another tab replaced the graph
          const now = performance.now(), dt = Math.min(.1, (now - (place.last || now)) / 1000);
          place.last = now;
          links.forEach(l => { if (l._label) l._label.visible = !!hover && (l.source.id === hover || l.target.id === hover); });
          nodes.forEach(n => {
            if (n.x === undefined) return;
            const hit = hl && n.name.toLowerCase().includes(hl);
            if (n._label) {
              n._label.material.color.set(hit ? 0xd29922 : 0xc9d1d9);
              n._label.material.opacity = hl && !hit ? .3 : 1;
            }
            const obj = n.__threeObj;
            const want = Math.max(selected === n ? 1.8 : 1, hit ? searchScale : 1);
            if (obj) { const k = obj.scale.x + (want - obj.scale.x) * .15; obj.scale.setScalar(k); }
            if (n._hit) n._hit.quaternion.set(0, 0, 0, 1);
            // The selected head turns slowly; others settle back to facing front
            if (n._cube) {
              const r = n._cube.rotation;
              if (selected === n) r.y += dt * 0.7;
              else if (r.x || r.z || r.y % (2 * Math.PI)) {
                const home = Math.round(r.y / (2 * Math.PI)) * 2 * Math.PI, e = Math.min(1, dt * 6);
                r.x -= r.x * e; r.z -= r.z * e; r.y += (home - r.y) * e;
              }
            }
            // Dragging with the right button turns only the cube the pointer hit: the frame follows it
            if (n._frame && n._cube) n._frame.quaternion.copy(n._cube.quaternion);
            if (n._frame) n._frame.material.color.set(hit ? 0xd29922 : (n.detected ? 0xf85149 : 0x4493f8));
          });
          // Camera moves we did not start (mouse controls) are logged too, at most four times a second
          const cp = graph3d.camera().position;
          if (lastCam && Date.now() > ownMoveUntil && Date.now() - lastLog > 250 &&
              Math.hypot(cp.x - lastCam.x, cp.y - lastCam.y, cp.z - lastCam.z) > .5) {
            lastLog = Date.now();
            dbg('camera moved by controls/other: ' + v3(lastCam) + ' -> ' + v3(cp));
          }
          lastCam = {x: cp.x, y: cp.y, z: cp.z};
          graphRaf = requestAnimationFrame(place);
        };
        place();
        fit(0, 'initial');
      };
      document.getElementById('g-ip').onchange = build;
      document.getElementById('g-rp').onchange = build;
      document.getElementById('g-2d').onchange = build;
      document.getElementById('g-dbg').onchange = e => { dbgBox.style.display = e.target.checked ? '' : 'none'; if (e.target.checked) dbg('debug on'); };
      // Matching heads grow more the rarer the match: 1 + 0.35 * log2(all / matching), at most 2.2x.
      // One match among 36 gets the full 2.2x, half of the graph matching gets 1.35x, everyone matching stays 1x.
      document.getElementById('g-search').oninput = e => {
        hl = e.target.value.trim().toLowerCase();
        const all = graph3d ? graph3d.graphData().nodes : [];
        const matching = hl ? all.filter(n => n.name.toLowerCase().includes(hl)).length : 0;
        searchScale = matching ? Math.min(2.2, 1 + .35 * Math.log2(all.length / matching)) : 1;
        dbg('search "' + hl + '": ' + matching + ' of ' + all.length + ' match, heads x' + searchScale.toFixed(2));
      };
      build();
    }

    async function showHome() {
      document.querySelector('.layout').classList.remove('wide');
      const main = document.getElementById('main-content');
      main.innerHTML = '<div class="loading">Loading...</div>';
      try {
        const [hackScans, langScans] = await Promise.all([
          apiFetch('scans?type=hack&limit=200'),
          apiFetch('scans?type=lang&limit=200')
        ]);
        const detected = hackScans.filter(s => s.has_detected == 1 || s.has_detected === true).length;
        const recent = [...hackScans, ...langScans].sort((a,b) => Number(b.timestamp) - Number(a.timestamp)).slice(0, 15);

        let cards = '';
        for (const s of recent) {
          cards += buildScanCard(s);
        }

        main.innerHTML =
          '<div class="section-title">Overview</div>' +
          '<div class="stat-row">' +
            '<div class="stat-card"><div class="stat-card-num">' + hackScans.length + '</div><div class="stat-card-label">Hack Scans</div></div>' +
            '<div class="stat-card"><div class="stat-card-num">' + langScans.length + '</div><div class="stat-card-label">Lang Checks</div></div>' +
            '<div class="stat-card"><div class="stat-card-num" style="color:var(--red)">' + detected + '</div><div class="stat-card-label">Detections</div></div>' +
          '</div>' +
          '<div class="section-title">Recent Activity</div>' +
          '<div class="scan-cards">' + (cards || '<div class="empty-state"><p>No scans yet.</p></div>') + '</div>';
      } catch(e) {
        main.innerHTML = '<div class="empty-state"><p>Error: ' + esc(e.message) + '</p></div>';
      }
    }

    function buildScanCard(s) {
      const results = s.results || [];
      let preview = '';
      if (s.type === 'hack') {
        preview = results.slice(0, 6).map(r => badge(r.result)).join(' ');
      } else {
        const r = results[0];
        preview = r ? '<span class="badge badge-lang">' + esc(r.language || 'Unknown') + '</span>' : '';
      }
      return '<div class="scan-card" onclick="showScan(' + s.id + ')">' +
        '<div class="scan-card-header">' +
          '<span class="scan-card-type">' + (s.type === 'hack' ? 'Hack Check' : 'Lang Check') + ' — ' + esc(s.target_name) + '</span>' +
          '<span class="scan-card-time">' + timeAgo(s.timestamp) + '</span>' +
        '</div>' +
        '<div class="scan-card-meta">by ' + esc(s.checker_name) + ' &nbsp;·&nbsp; ' + new Date(Number(s.timestamp)).toLocaleString() + '</div>' +
        (preview ? '<div style="padding:8px 14px;display:flex;flex-wrap:wrap;gap:4px">' + preview + '</div>' : '') +
      '</div>';
    }

    async function showScan(id) {
      const main = document.getElementById('main-content');
      main.innerHTML = '<div class="loading">Loading scan #' + id + '...</div>';
      try {
        const scan = await apiFetch('scan/' + id);
        const results = scan.results || [];

        let body = '';
        if (scan.type === 'hack') {
          if (results.length === 0) {
            body = '<div class="empty-state"><p>No results saved for this scan.</p></div>';
          } else {
            let rows = '';
            for (const r of results) {
              rows += '<tr><td>' + esc(r.hack_name) + '</td><td>' + badge(r.result) + '</td></tr>';
            }
            body = '<table class="results-table"><thead><tr><th>Mod</th><th>Result</th></tr></thead><tbody>' + rows + '</tbody></table>';
          }
        } else {
          const r = results[0];
          if (r) {
            body = '<table class="results-table"><thead><tr><th>Language</th><th>Raw Response</th></tr></thead><tbody>' +
              '<tr><td><span class="badge badge-lang">' + esc(r.language || 'Unknown') + '</span></td><td>' + esc(r.response || '') + '</td></tr>' +
              '</tbody></table>';
          } else {
            body = '<div class="empty-state"><p>No results saved for this scan.</p></div>';
          }
        }

        const backTarget = scan.target_name;
        main.innerHTML =
          '<button class="back-btn" onclick="showPlayer(\'' + esc(backTarget) + '\')">← ' + esc(backTarget) + '</button>' +
          '<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden">' +
            '<div style="padding:14px 16px;border-bottom:1px solid var(--border)">' +
              '<div style="font-size:16px;font-weight:700;margin-bottom:4px">' +
                (scan.type === 'hack' ? 'Hack Check' : 'Lang Check') + ' — ' + esc(scan.target_name) +
              '</div>' +
              '<div style="font-size:12px;color:var(--text2)">by ' + esc(scan.checker_name) + ' · ' + new Date(Number(scan.timestamp)).toLocaleString() + '</div>' +
              (scan.reason ? '<div style="font-size:12px;color:var(--text2);margin-top:2px">Reason: ' + esc(scan.reason) + '</div>' : '') +
            '</div>' +
            body +
          '</div>';
      } catch(e) {
        main.innerHTML = '<div class="empty-state"><p>Failed to load scan #' + id + '</p><p class="error-msg">' + esc(e.message) + '</p></div>';
      }
    }

    async function showPlayer(name) {
      document.querySelector('.layout').classList.remove('wide');
      addHistory(name);
      const main = document.getElementById('main-content');
      main.innerHTML = '<div class="loading">Loading ' + esc(name) + '...</div>';
      try {
        const data = await apiFetch('player/' + encodeURIComponent(name));
        const scans = data.scans || [];
        const uuid = data.uuid || name;

        const onlineBadge = data.online
          ? '<span class="online-badge"><span style="width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block"></span> Online</span>'
          : '<span class="offline-badge">Offline</span>';

        let runButtons = '';
        if (data.online) {
          runButtons =
            '<button class="run-btn" id="btn-hack" onclick="runScan(\'' + esc(name) + '\',\'hack\')">Run Hack Check</button>' +
            '<button class="run-btn" id="btn-lang" onclick="runScan(\'' + esc(name) + '\',\'lang\')">Run Lang Check</button>';
        }

        let cards = '';
        for (const s of scans) cards += buildScanCard(s);

        main.innerHTML =
          '<button class="back-btn" onclick="showHome()">← Home</button>' +
          '<div class="player-header">' +
            '<img src="' + headUrl(uuid) + '" onerror="this.src=\'' + headUrl(name) + '\'" width="64" height="64" alt="">' +
            '<div class="player-header-info"><h2>' + esc(name) + '</h2><p>' + esc(uuid) + '</p>' + onlineBadge + '</div>' +
          '</div>' +
          runButtons +
          '<div class="section-title">' + scans.length + ' Scan' + (scans.length !== 1 ? 's' : '') + '</div>' +
          '<div class="scan-cards">' + (cards || '<div class="empty-state"><p>No scans for this player yet.</p></div>') + '</div>';
      } catch(e) {
        main.innerHTML = '<div class="empty-state"><p>Failed to load player.</p><p class="error-msg">' + esc(e.message) + '</p></div>';
      }
    }

    async function runScan(name, type) {
      const btn = document.getElementById(type === 'hack' ? 'btn-hack' : 'btn-lang');
      if (btn) btn.disabled = true;
      try {
        await apiPost('scan/run', { player: name, type: type });
        showToast((type === 'hack' ? 'Hack check' : 'Lang check') + ' started on ' + name);
        setTimeout(() => showPlayer(name), 4000);
      } catch(e) {
        main.innerHTML = '<div class="empty-state"><p>Failed to run scan: ' + esc(e.message) + '</p></div>';
        if (btn) btn.disabled = false;
      }
    }

    async function loadRecentScans() {
      try {
        const scans = await apiFetch('scans?limit=30');
        const container = document.getElementById('recent-scans');
        if (!container) return;
        if (!scans || scans.length === 0) {
          container.innerHTML = '<div style="padding:10px;color:var(--text2);font-size:12px;text-align:center">No scans yet</div>';
          return;
        }
        container.innerHTML = '';
        for (const s of scans) {
          const el = document.createElement('div');
          el.className = 'scan-item';
          el.onclick = () => showScan(s.id);
          el.innerHTML =
            '<div class="scan-item-top">' +
              '<span class="scan-item-name">' + esc(s.target_name) + '</span>' +
              '<span class="scan-item-time">' + timeAgo(s.timestamp) + '</span>' +
            '</div>' +
            '<div class="scan-item-meta">' + (s.type === 'hack' ? 'Hack' : 'Lang') + ' · by ' + esc(s.checker_name) + '</div>';
          container.appendChild(el);
        }
      } catch(e) {}
    }

    async function loadOnlinePlayers() {
      try {
        const players = await apiFetch('players/online');
        const container = document.getElementById('online-players');
        if (!container) return;
        if (!players || players.length === 0) {
          container.innerHTML = '<div style="padding:10px;color:var(--text2);font-size:12px;text-align:center">No players online</div>';
          return;
        }
        container.innerHTML = '';
        for (const p of players) {
          const el = document.createElement('div');
          el.className = 'player-item';
          el.onclick = () => showPlayer(p.name);
          el.innerHTML =
            '<img src="' + headUrl(p.uuid) + '" onerror="this.src=\'' + headUrl(p.name) + '\'" alt="" width="28" height="28">' +
            '<span class="player-item-name">' + esc(p.name) + '</span>' +
            '<div class="online-dot"></div>';
          container.appendChild(el);
        }
      } catch(e) {}
    }

    function addHistory(name) {
      offlineHistory = [name, ...offlineHistory.filter(n => n !== name)].slice(0, 20);
      try { localStorage.setItem('ch_history', JSON.stringify(offlineHistory)); } catch(e) {}
      renderOfflineHistory();
    }

    function renderOfflineHistory() {
      const container = document.getElementById('offline-history');
      if (!container) return;
      if (offlineHistory.length === 0) {
        container.innerHTML = '<div style="padding:10px;color:var(--text2);font-size:12px;text-align:center">Search a player above</div>';
        return;
      }
      container.innerHTML = '';
      for (const name of offlineHistory) {
        const el = document.createElement('div');
        el.className = 'player-item';
        el.onclick = () => showPlayer(name);
        el.innerHTML =
          '<img src="' + headUrl(name) + '" onerror="this.style.visibility=\'hidden\'" alt="" width="28" height="28">' +
          '<span class="player-item-name">' + esc(name) + '</span>';
        container.appendChild(el);
      }
    }

    function searchPlayer() {
      const name = document.getElementById('search-input').value.trim();
      if (!name) return;
      document.getElementById('search-input').value = '';
      showPlayer(name);
    }

    init();
</script>
</body>
</html>

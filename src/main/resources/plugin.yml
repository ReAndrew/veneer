name: Veneer
version: ${project.version}
main: com.veneer.VeneerPlugin
api-version: '1.21'
folia-supported: true
description: Client spoof detection and sign-translation hack detection in one plugin.
authors: [GigaZelensky, Branduzzo]

softdepend: [ProtocolLib, ProtocolSupport, ViaVersion, ViaBackwards, ViaRewind, Geyser-Spigot, PlaceholderAPI, LuckPerms, GrimAC, Vulcan, Spartan, Matrix, Intave, AAC, floodgate]
loadbefore: [PacketEvents]

commands:
  spoof:
    description: Inspect client brand/channels and manage the spoof detection module
    usage: /spoof help
    permission: veneer.spoof.use
    aliases: [antispoof]
  hackcheck:
    description: Check a player for installed hacks/mods.
    usage: /hackcheck <player> [hack1,hack2,...]
    permission: veneer.hacks.check
    aliases: [checkhacks]
  hackreload:
    description: Reload the hack detection configuration.
    usage: /hackreload
    permission: veneer.hacks.reload
    aliases: [chreload]
  hackalerts:
    description: Toggle hack detection alerts.
    usage: /hackalerts
    permission: veneer.hacks.alerts
    aliases: [chalerts, checkalerts]
  hacklang:
    description: Check the client language of a player.
    usage: /hacklang <player> [lang1,lang2,...]
    permission: veneer.hacks.lang
    aliases: [checklang]
  hackeditor:
    description: Open the hack detection web editor.
    usage: /hackeditor
    permission: veneer.hacks.editor
    aliases: [cheditor]
  rptrack:
    description: Show RPTrack (resource-pack cache) data and linked accounts.
    usage: /rptrack <player>
    permission: veneer.hacks.rptrack
    aliases: [hackfp]

permissions:
  veneer.spoof.use:
    description: Use /spoof
    default: op
  veneer.spoof.admin:
    description: Admin spoof commands such as reload
    default: op
  veneer.spoof.alerts:
    description: Receive spoof alerts
    default: op
  veneer.spoof.bypass:
    description: Bypass all spoof checks
    default: false
  veneer.hacks.check:
    description: Use /hackcheck
    default: op
  veneer.hacks.rptrack:
    description: Use /rptrack
    default: op
  veneer.hacks.reload:
    description: Use /hackreload
    default: op
  veneer.hacks.alerts:
    description: Receive hack alerts and use /hackalerts
    default: op
  veneer.hacks.lang:
    description: Use /hacklang
    default: op
  veneer.hacks.editor:
    description: Use /hackeditor
    default: op
  veneer.hacks.update:
    description: Reserved (updater is disabled in this build)
    default: op
  veneer.spoof.*:
    description: All spoof permissions
    default: false
    children:
      veneer.spoof.use: true
      veneer.spoof.admin: true
      veneer.spoof.alerts: true
  veneer.hacks.*:
    description: All hack detection permissions
    default: false
    children:
      veneer.hacks.check: true
      veneer.hacks.rptrack: true
      veneer.hacks.reload: true
      veneer.hacks.alerts: true
      veneer.hacks.lang: true
      veneer.hacks.editor: true
      veneer.hacks.update: true
  veneer.*:
    description: Everything
    default: false
    children:
      veneer.spoof.*: true
      veneer.hacks.*: true

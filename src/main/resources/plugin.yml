name: Invalider
version: ${project.version}
main: com.invalider.InvaliderPlugin
api-version: '1.21'
folia-supported: true
description: Merged plugin combining AntiSpoof (client spoof detection) and CheckHacks (sign-translation hack detection).
authors: [GigaZelensky, Branduzzo]

softdepend: [ProtocolLib, ProtocolSupport, ViaVersion, ViaBackwards, ViaRewind, Geyser-Spigot, PlaceholderAPI, GrimAC, Vulcan, Spartan, Matrix, Intave, AAC, floodgate]
loadbefore: [PacketEvents]

commands:
  antispoof:
    description: View client channel information and manage the AntiSpoof module
    usage: /antispoof help
    permission: antispoof.command
  checkhacks:
    description: Check a player for installed hacks/mods.
    usage: /checkhacks <player> [hack1,hack2,...]
    permission: checkhacks.check
  chreload:
    description: Reload CheckHacks configuration.
    usage: /chreload
    permission: checkhacks.reload
  chalerts:
    description: Toggle hack detection alerts.
    usage: /chalerts
    permission: checkhacks.alerts
    aliases: [checkalerts, alerts]
  checklang:
    description: Check the language of a player.
    usage: /checklang <player> [lang1,lang2,...]
    permission: checkhacks.checklang
  cheditor:
    description: Open the CheckHacks web editor.
    usage: /cheditor
    permission: checkhacks.editor
  checkhacksupdate:
    description: Disabled in this merged build - download new Invalider releases manually instead.
    usage: /checkhacksupdate
    permission: checkhacks.update

permissions:
  antispoof.command:
    description: Access to AntiSpoof commands
    default: op
  antispoof.admin:
    description: Access to admin commands like reload
    default: op
  antispoof.alerts:
    description: Receive spoof alerts
    default: op
  antispoof.bypass:
    description: Bypass all spoof checks
    default: false
  checkhacks.check:
    description: Use /checkhacks.
    default: op
  checkhacks.reload:
    description: Use /chreload.
    default: op
  checkhacks.alerts:
    description: Receive alerts and use /chalerts.
    default: op
  checkhacks.checklang:
    description: Use /checklang.
    default: op
  checkhacks.editor:
    description: Use /cheditor.
    default: op
  checkhacks.update:
    description: Receive update notifications and run /checkhacksupdate (disabled in the merged build).
    default: op
  checkhacks.*:
    description: All CheckHacks permissions.
    default: false
    children:
      checkhacks.check: true
      checkhacks.reload: true
      checkhacks.alerts: true
      checkhacks.checklang: true
      checkhacks.editor: true
      checkhacks.update: true

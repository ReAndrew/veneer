  # RPTrack: resource-pack cache fingerprint (https://alaggydev.github.io/posts/cytooxien/).
  # Links accounts/IPs of the same Minecraft installation via its pack download cache.
  # This is covert tracking of players: disclose it in your rules/privacy policy.
  rptrack:
    enabled: false
    # Where clients download the packs, e.g. "http://play.example.com:8123". Must be reachable by players.
    # Point it at localhost (e.g. "http://localhost:8123") and Veneer serves the packs itself on that port;
    # clients are then sent to the host they joined with. Otherwise no server is started: host the files
    # exported to plugins/Veneer/rptrack/fp/ at <public-url>/fp/.
    public-url: ""
    # How many probe packs exist and are checked on every join.
    track: 28
    # How many of them a fresh client is sent (it downloads and caches these). Must be <= track.
    send: 6
    # How many cached packs must overlap with a stored fingerprint to link two accounts. Must be <= send.
    match: 5
    # Log every step (statuses, cached packs, stability against the stored fingerprint) to the console.
    debug: false
    delay-ticks: 40           # wait after join before probing
    timeout-ticks: 100        # max wait for client answers
    liquidbounce-probe: true  # detect LiquidBounce via its 127.0.0.1:15000 server
    alert: true               # notify veneer.hacks.alerts holders on a match
